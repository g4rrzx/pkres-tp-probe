name: Publish Artifact
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Exchange for env-bound package WITH the environment
        run: |
          ORG=pkresearchlab
          PKG=g4rrzx/env-pkg
          AUD=$(curl -sS "https://packagist.com/api/oidc/audience/$ORG" | jq -r .audience)
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq -c '{environment: .environment, job_workflow_ref: .job_workflow_ref}'
          CODE=$(curl -sS -o /tmp/c.json -w '%{http_code}' -X POST -H "Authorization: Bearer $JWT" "https://packagist.com/api/oidc/token-exchange/$ORG/$PKG")
          echo "WITH-ENVIRONMENT exchange HTTP=$CODE"
          jq -c 'if .key then {key:.key,secret:"REDACTED"} else . end' /tmp/c.json
