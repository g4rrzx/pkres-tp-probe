name: OIDC Credential Scope Probe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exchange and probe
        run: |
          set -u
          ORG=pkresearchlab
          PKG=g4rrzx/probe-pkg
          AUD=$(curl -sS "https://packagist.com/api/oidc/audience/$ORG" | jq -r .audience)
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          curl -sS -X POST -H "Authorization: Bearer $JWT" "https://packagist.com/api/oidc/token-exchange/$ORG/$PKG" > /tmp/creds.json
          echo "exchange ok: $(jq -c 'if .key then {key:.key,secret:"<redacted>"} else . end' /tmp/creds.json)"
          python3 scope_probe.py
